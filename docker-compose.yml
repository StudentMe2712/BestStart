services:
  db:
    image: pgvector/pgvector:pg16
    container_name: pam-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: pam
      POSTGRES_PASSWORD: pam
      POSTGRES_DB: pam
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pam"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pam-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    # LLM keys (GROQ_API_KEY / OPENROUTER_API_KEY / LLM_PROVIDER / models) come
    # from backend/.env. The explicit `environment:` block below overrides any
    # DATABASE_URL/OLLAMA_URL in that file (compose env > env_file) so the
    # container always uses the local pg container + host Ollama.
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://pam:pam@db:5432/pam
      CORS_ORIGINS: "chrome-extension://*,http://localhost:3000"
      LOG_LEVEL: INFO
      # Reach the host's Ollama (embeddings) from inside the container.
      OLLAMA_URL: "http://host.docker.internal:11434"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./backend/alembic.ini:/app/alembic.ini
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

services:
  kzflight-sniper:
    container_name: kzflight-sniper-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - TZ=Asia/Atyrau
      - BOT_TOKEN=${BOT_TOKEN}
      - APP_PORT=${APP_PORT:-8000}
      - DATABASE_PATH=${DATABASE_PATH:-/app/data/sniper.db}
      - CHECK_INTERVAL_SECONDS=${CHECK_INTERVAL_SECONDS:-60}
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - ./backend/data:/app/data
    shm_size: '2gb'

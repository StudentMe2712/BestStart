[project]
name = "pam-backend"
version = "0.1.0"
description = "Personal AI Memory — backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.6",
    "pydantic-settings>=2.1",
    "python-multipart",
    "pgvector>=0.3",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "markitdown[pdf,docx,pptx,xlsx]>=0.1.6",
    "youtube-transcript-api>=1.0",
    "aiogram>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

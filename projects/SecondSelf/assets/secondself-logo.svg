<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 176" role="img" aria-labelledby="title desc">
  <title id="title">Second Self logo</title>
  <desc id="desc">The Second Self continuous-path symbol paired with a clean uppercase wordmark.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3A1D12"/><stop offset="1" stop-color="#100D0C"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE0A0"/><stop offset="0.35" stop-color="#F8B966"/><stop offset="1" stop-color="#C85B20"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="160" height="160" rx="38" fill="url(#bg)" stroke="#FFF3E4" stroke-opacity="0.14" stroke-width="2"/>
  <path d="M 119 51 C 119 40 106 32 91 32 C 67 32 48 49 48 72 C 48 94 66 102 90 102 C 115 102 133 113 133 135 C 133 157 114 168 90 168 C 74 168 60 163 52 155" fill="none" stroke="url(#gold)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" transform="translate(0,-12)"/>
  <text x="204" y="105" fill="#F7EDE3" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="53" font-weight="650" letter-spacing="5">SECOND SELF</text>
  <text x="207" y="139" fill="#C9A995" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="500" letter-spacing="4.2">A PERSONAL SPACE FOR PROGRESS</text>
</svg>

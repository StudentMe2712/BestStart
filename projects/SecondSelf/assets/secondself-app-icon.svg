      <stop offset="0.55" stop-color="#8D3517" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#8D3517" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0.12" y1="0.08" x2="0.9" y2="0.92">

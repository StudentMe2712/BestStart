    <path d="M 682 270 C 682 210 623 176 540 176 C 392 176 286 267 286 399 C 286 525 390 574 533 574 C 680 574 738 639 738 756 C 738 874 634 942 490 942 C 396 942 323 912 278 864" fill="none" stroke="url(#mark)" stroke-width="82" stroke-linecap="round" stroke-linejoin="round"/>

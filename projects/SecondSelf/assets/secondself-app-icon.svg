<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Second Self app icon</title>
  <desc id="desc">A continuous amber path forming an S on a deep warm charcoal field.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3A1D12"/>
      <stop offset="0.48" stop-color="#21120E"/>
      <stop offset="1" stop-color="#100D0C"/>
    </linearGradient>
    <radialGradient id="ambience" cx="0.27" cy="0.2" r="0.85">
